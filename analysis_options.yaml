include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    # Pigeon codegen input, consumed by the pigeon tool, not shipped; it
    # imports package:pigeon, which is intentionally not a dependency of
    # this package.
    - "pigeons/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
